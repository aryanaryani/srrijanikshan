    <style>
        :root {
            --primary-color: #2563EB;
            --secondary-color: #F4B400;
            --text-dark: #0F172A;
            --text-light: #475569;
            --bg-light: #F8FAFC;
            --white: #FFFFFF;
            --border-color: #E2E8F0;
            --high: #DC2626;
            --important: #D97706;
            --practice: #059669;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Noto Sans Devanagari', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); line-height: 1.6; }
        a { text-decoration: none; }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

        header { background: var(--white); box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05); position: sticky; top: 0; z-index: 1000; }
        .nav-container { display: flex; justify-content: space-between; align-items: center; height: 75px; }
        .logo { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
        .logo-text-dark { color: var(--text-dark); }
        .logo-text-blue { color: var(--primary-color); }
        .btn-primary { background: var(--primary-color); color: var(--white); padding: 8px 18px; border-radius: 8px; font-weight: 600; border: none; cursor: pointer; font-size: 14px; }
        .btn-outline { background: var(--white); color: var(--primary-color); padding: 8px 18px; border-radius: 8px; font-weight: 600; border: 1.5px solid var(--primary-color); cursor: pointer; font-size: 14px; }

        .page-header { background: linear-gradient(135deg, #EFF6FF 0%, #FFFFFF 100%); padding: 44px 0 30px; text-align: center; border-bottom: 1px solid var(--border-color); }
        .page-header h1 { font-size: 32px; margin-bottom: 8px; }
        .page-header p { color: var(--text-light); }

        .filters-bar {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            margin: 30px 0 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            box-shadow: 0 4px 6px -1px rgba(15,23,42,.04);
        }
        .filters-bar .field label { display: block; font-size: 12.5px; color: var(--text-light); margin-bottom: 5px; font-weight: 600; }
        .filters-bar select {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);
            font-size: 14px; background: var(--white); color: var(--text-dark);
        }

        .results-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 14px; color: var(--text-light); }

        .q-card {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 12px;
            box-shadow: 0 2px 4px rgba(15,23,42,.03);
        }
        .q-meta { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .q-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: .03em; }
        .q-badge.type { background: #EFF6FF; color: var(--primary-color); }
        .q-badge.high { background: #FEF2F2; color: var(--high); }
        .q-badge.important { background: #FFFBEB; color: var(--important); }
        .q-badge.practice { background: #ECFDF5; color: var(--practice); }
        .q-text { font-weight: 600; margin-bottom: 10px; font-size: 15.5px; }
        .q-options { list-style: none; margin-bottom: 8px; }
        .q-options li { padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; font-size: 14px; background: var(--bg-light); }
        .q-options li.correct { background: #ECFDF5; color: var(--practice); font-weight: 600; }
        .q-toggle { color: var(--primary-color); font-size: 13px; font-weight: 600; cursor: pointer; background: none; border: none; padding: 0; margin-top: 4px; }
        .q-answer { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-color); font-size: 14px; color: var(--text-light); display: none; }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 14px; margin: 30px 0 50px; }
        .pagination button {
            padding: 9px 18px; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--white); cursor: pointer; font-weight: 600; font-size: 14px;
        }
        .pagination button:disabled { opacity: .4; cursor: not-allowed; }
        .pagination span { font-size: 14px; color: var(--text-light); }
        .notes-tab-btn {
            padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-color);
            background: var(--white); cursor: pointer; font-size: 13px; font-weight: 600;
            white-space: nowrap; color: var(--text-light);
        }
        .notes-tab-btn.active { background: var(--primary-color); color: var(--white); border-color: var(--primary-color); }
        .flashcard {
            perspective: 1000px; height: 150px; margin-bottom: 14px; cursor: pointer;
        }
        .flashcard-inner {
            position: relative; width: 100%; height: 100%; transition: transform .5s;
            transform-style: preserve-3d;
        }
        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            padding: 16px; text-align: center; font-weight: 600; font-size: 15px;
        }
        .flashcard-front { background: var(--primary-color); color: var(--white); }
        .flashcard-back { background: #ECFDF5; color: var(--text-dark); transform: rotateY(180deg); font-weight: 500; font-size: 14px; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }

        footer { background: var(--text-dark); color: var(--white); padding: 40px 0 20px; margin-top: 60px; text-align: center; }
        footer a { color: #94A3B8; margin: 0 10px; }

        @media (max-width: 720px) {
            .filters-bar { grid-template-columns: 1fr 1fr; }
        }
    </style>
    <link rel="icon" type="image/png" href="logo2.png">
</head>
<body>
    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <span class="logo-text-dark">Topper</span><span class="logo-text-blue">Way</span>
            </a>
            <a href="index.html" class="btn-primary">Home</a>
        </div>
    </header>

    <section class="page-header">
        <div class="container">
            <h1>📚 Question Bank</h1>
            <p>Subject और Chapter चुनें, फिर सारे questions Priority के साथ देखें</p>
        </div>
    </section>

    <div class="container">
        <div class="filters-bar">
            <div class="field">
                <label>विषय (Subject)</label>
                <select id="subjectFilter">
                    <option value="">-- चुनें --</option>
                </select>
            </div>
            <div class="field">
                <label>Chapter</label>
                <select id="chapterFilter">
                    <option value="">सभी Chapters</option>
                </select>
            </div>
            <div class="field">
                <label>Type</label>
                <select id="typeFilter">
                    <option value="">सभी</option>
                    <option value="mcq">MCQ</option>
                    <option value="short">Short Answer</option>
                    <option value="long">Long Answer</option>
                </select>
            </div>
            <div class="field">
                <label>Priority</label>
                <select id="priorityFilter">
                    <option value="">सभी</option>
                    <option value="high">High</option>
                    <option value="important">Important</option>
                    <option value="practice">Practice</option>
                </select>
            </div>
        </div>

        <div class="results-meta">
            <span id="resultsCount">विषय चुनकर शुरू करें</span>
            <button class="btn-primary" id="openNotesBtn" style="display:none;">📝 AI Notes बनाएं</button>
        </div>

        <div id="notesPanel" style="display:none;">
            <div class="filters-bar" style="display:flex;gap:8px;overflow-x:auto;padding:12px;">
                <button class="notes-tab-btn active" data-type="short">📌 Short Notes</button>
                <button class="notes-tab-btn" data-type="detailed">📖 Detailed Notes</button>
                <button class="notes-tab-btn" data-type="formulas">🧮 Formulas</button>
                <button class="notes-tab-btn" data-type="flashcards">🎴 Flashcards</button>
                <button class="notes-tab-btn" data-type="important_questions">⭐ Important Questions</button>
            </div>
            <div id="notesContent" class="q-card" style="min-height:200px;"></div>
        </div>

        <div id="questionsList"></div>

        <div class="pagination" id="paginationBar" style="display:none;">
            <button id="prevPageBtn">← पिछला</button>
            <span id="pageLabel">Page 1</span>
            <button id="nextPageBtn">अगला →</button>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 Sriijan Ikshan. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // auth-check.js window.supabaseClient banati hai; "var" jaan-boojh kar
        // use kiya hai (const/let nahi) kyunki agar yeh script kisi wajah se
        // do baar chal jaaye to var kabhi SyntaxError nahi deta
        var supabase = window.supabaseClient;
        var PAGE_SIZE = 20;
        var currentPage = 0;
        var totalCount = 0;

        var subjectFilter = document.getElementById("subjectFilter");
        var chapterFilter = document.getElementById("chapterFilter");
        var typeFilter = document.getElementById("typeFilter");
        var priorityFilter = document.getElementById("priorityFilter");
        var questionsList = document.getElementById("questionsList");
        var resultsCount = document.getElementById("resultsCount");
        var paginationBar = document.getElementById("paginationBar");
        var pageLabel = document.getElementById("pageLabel");
        var prevBtn = document.getElementById("prevPageBtn");
        var nextBtn = document.getElementById("nextPageBtn");

        function priorityBadgeClass(p) {
            if (p === "high") return "high";
            if (p === "important") return "important";
            return "practice";
        }
        function priorityLabel(p) {
            if (p === "high") return "High Priority";
            if (p === "important") return "Important";
            return "Practice";
        }
        function typeLabel(t) {
            if (t === "mcq") return "MCQ";
            if (t === "short") return "Short Answer";
            return "Long Answer";
        }

        // Subject_access wali value (jaise "Maths") aur subjects table ke name se match karta hai
        function subjectMatchesAccess(subjectName, accessValue) {
            if (!subjectName || !accessValue) return false;
            return subjectName.trim().toLowerCase() === accessValue.trim().toLowerCase();
        }

        async function loadSubjects() {
            var res = await supabase.from("subjects").select("id, name, slug").order("id");
            var allSubjects = res.data || [];

            var plan = window.userProfile || { subscription_status: "FREE" };
            var allowedSubjects = allSubjects;

            if (plan.subscription_status === "PAID_SINGLE" && plan.subject_access) {
                var filtered = allSubjects.filter(function (s) {
                    return subjectMatchesAccess(s.name, plan.subject_access);
                });
                if (filtered.length) allowedSubjects = filtered;
            }

            allowedSubjects.forEach(function (s) {
                var opt = document.createElement("option");
                opt.value = s.id;
                opt.textContent = s.name;
                subjectFilter.appendChild(opt);
            });

            // Single-subject wale user ke liye dropdown lock karke seedha unka subject load kar do
            if (plan.subscription_status === "PAID_SINGLE" && allowedSubjects.length === 1) {
                subjectFilter.value = allowedSubjects[0].id;
                subjectFilter.disabled = true;
                var lockNote = document.createElement("p");
                lockNote.style.cssText = "font-size:12.5px;color:var(--text-light);margin-top:6px;";
                lockNote.textContent = "🔒 आपका Single Subject Pack सिर्फ " + allowedSubjects[0].name + " के लिए है।";
                subjectFilter.parentElement.appendChild(lockNote);
            }
        }

        async function loadChapters(subjectId) {
            chapterFilter.innerHTML = '<option value="">सभी Chapters</option>';
            if (!subjectId) return;
            var res = await supabase.from("chapters").select("id, name, chapter_number")
                .eq("subject_id", subjectId).order("chapter_number");
            (res.data || []).forEach(function (c) {
                var opt = document.createElement("option");
                opt.value = c.id;
                opt.textContent = c.name;
                chapterFilter.appendChild(opt);
            });
        }

        function renderQuestion(q) {
            var div = document.createElement("div");
            div.className = "q-card";

            var badgesHtml = '<span class="q-badge type">' + typeLabel(q.type) + '</span>' +
                '<span class="q-badge ' + priorityBadgeClass(q.priority) + '">' + priorityLabel(q.priority) + '</span>';

            var optionsHtml = "";
            if (q.type === "mcq" && q.options) {
                optionsHtml = '<ul class="q-options">';
                q.options.forEach(function (opt) {
                    var isCorrect = opt === q.correct_answer;
                    optionsHtml += '<li class="' + (isCorrect ? "correct" : "") + '">' + opt + (isCorrect ? " ✓" : "") + '</li>';
                });
                optionsHtml += '</ul>';
            }

            var answerHtml = "";
            var toggleHtml = "";
            if (q.type !== "mcq") {
                answerHtml = '<div class="q-answer">' + (q.correct_answer || "").replace(/\n/g, "<br>") + '</div>';
                toggleHtml = '<button class="q-toggle">उत्तर दिखाएं</button>';
            }

            div.innerHTML =
                '<div class="q-meta" style="justify-content:space-between;display:flex;align-items:center;">' +
                  '<div>' + badgesHtml + '</div>' +
                  '<button onclick="saveQuestionToLibrary(\'' + q.id + '\')" style="background:none;border:1px solid var(--secondary-color);color:var(--secondary-color);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;">🔖 Save</button>' +
                '</div>' +
                '<div class="q-text">' + q.question_text + '</div>' +
                optionsHtml + toggleHtml + answerHtml;

            var toggleBtn = div.querySelector(".q-toggle");
            if (toggleBtn) {
                toggleBtn.addEventListener("click", function () {
                    var ans = div.querySelector(".q-answer");
                    var showing = ans.style.display === "block";
                    ans.style.display = showing ? "none" : "block";
                    toggleBtn.textContent = showing ? "उत्तर दिखाएं" : "उत्तर छुपाएं";
                });
            }

            return div;
        }

        var loadedQuestionsMap = {};

        async function saveQuestionToLibrary(qId) {
            var session = await supabase.auth.getSession();
            var userId = session.data.session ? session.data.session.user.id : null;
            if (!userId) {
                alert("Save करने के लिए पहले Home page पर जाकर लॉगिन करें।");
                return;
            }
            var q = loadedQuestionsMap[qId];
            if (!q) return;
            var res = await supabase.from("library_items").insert({
                user_id: userId,
                item_type: "question",
                title: q.question_text.slice(0, 80),
                content: q
            });
            if (res.error) {
                alert("Save नहीं हो पाया: " + res.error.message);
            } else {
                alert("✅ Save हो गया! अपनी Library में देखें।");
            }
        }

        async function loadQuestions() {
            var subjectId = subjectFilter.value;
            if (!subjectId) {
                questionsList.innerHTML = '<div class="empty-state">ऊपर से विषय चुनें ताकि questions दिखें।</div>';
                resultsCount.textContent = "विषय चुनकर शुरू करें";
                paginationBar.style.display = "none";
                return;
            }

            questionsList.innerHTML = '<div class="empty-state">लोड हो रहा है...</div>';

            var query = supabase.from("questions").select("*", { count: "exact" }).eq("subject_id", subjectId);
            if (chapterFilter.value) query = query.eq("chapter_id", chapterFilter.value);
            if (typeFilter.value) query = query.eq("type", typeFilter.value);
            if (priorityFilter.value) query = query.eq("priority", priorityFilter.value);

            var from = currentPage * PAGE_SIZE;
            var to = from + PAGE_SIZE - 1;
            query = query.range(from, to);

            var res = await query;
            if (res.error) {
                questionsList.innerHTML = '<div class="empty-state">गड़बड़ हुई: ' + res.error.message + '</div>';
                return;
            }

            totalCount = res.count || 0;
            var data = res.data || [];

            if (data.length === 0) {
                questionsList.innerHTML = '<div class="empty-state">इस filter के लिए कोई question नहीं मिला।</div>';
                resultsCount.textContent = "0 results";
                paginationBar.style.display = "none";
                return;
            }

            questionsList.innerHTML = "";
            data.forEach(function (q) {
                loadedQuestionsMap[q.id] = q;
                questionsList.appendChild(renderQuestion(q));
            });

            resultsCount.textContent = totalCount + " questions मिले";

            var totalPages = Math.max(1, Math.ceil(totalCount / PAGE_SIZE));
            pageLabel.textContent = "Page " + (currentPage + 1) + " / " + totalPages;
            prevBtn.disabled = currentPage === 0;
            nextBtn.disabled = currentPage >= totalPages - 1;
            paginationBar.style.display = "flex";

            window.scrollTo({ top: document.querySelector(".filters-bar").offsetTop - 20, behavior: "smooth" });
        }

        subjectFilter.addEventListener("change", function () {
            currentPage = 0;
            loadChapters(subjectFilter.value);
            loadQuestions();
        });
        chapterFilter.addEventListener("change", function () { currentPage = 0; loadQuestions(); });
        typeFilter.addEventListener("change", function () { currentPage = 0; loadQuestions(); });
        priorityFilter.addEventListener("change", function () { currentPage = 0; loadQuestions(); });

        prevBtn.addEventListener("click", function () {
            if (currentPage > 0) { currentPage--; loadQuestions(); }
        });
        nextBtn.addEventListener("click", function () {
            currentPage++; loadQuestions();
        });

        async function init() {
            if (window.authCheckReady) { await window.authCheckReady; } // userProfile load hone ka wait karo
            await loadSubjects();
            var params = new URLSearchParams(window.location.search);
            var subjectId = params.get("subject");
            var chapterId = params.get("chapter");
            if (subjectId && !subjectFilter.disabled) {
                subjectFilter.value = subjectId;
                await loadChapters(subjectId);
                if (chapterId) chapterFilter.value = chapterId;
                loadQuestions();
            } else if (subjectFilter.value) {
                // PAID_SINGLE case: loadSubjects() ne already select kar diya, ab chapters+questions load karo
                await loadChapters(subjectFilter.value);
                loadQuestions();
            }
        }

        async function saveNotesToLibrary() {
            var session = await supabase.auth.getSession();
            var userId = session.data.session ? session.data.session.user.id : null;
            if (!userId) { alert("Save करने के लिए पहले Home page पर जाकर लॉगिन करें।"); return; }
            var data = window.lastNotesData;
            var type = window.lastNotesType;
            if (!data) return;
            var typeLabels = { short: "Short Notes", detailed: "Detailed Notes", formulas: "Formulas", flashcards: "Flashcards", important_questions: "Important Questions" };
            var res = await supabase.from("library_items").insert({
                user_id: userId,
                item_type: "note",
                title: data.chapter_name + " — " + (typeLabels[type] || type),
                content: data
            });
            if (res.error) alert("Save नहीं हो पाया: " + res.error.message);
            else alert("✅ Notes Library में save हो गए!");
        }

        init();
        var SUPABASE_URL = "https://tphrdecdljxaqogocuxw.supabase.co";
        var SUPABASE_ANON_KEY = "sb_publishable_ot4NbsQjhhSPdj8VB76kRQ_TNQL3IUy";
        var SUPABASE_FN_BASE = SUPABASE_URL + "/functions/v1/";
        
        document.getElementById("openNotesBtn").addEventListener("click", function () {
            var panel = document.getElementById("notesPanel");
            panel.style.display = panel.style.display === "none" ? "block" : "none";
            if (panel.style.display === "block") loadNotes("short");
        });

        document.querySelectorAll(".notes-tab-btn").forEach(function (btn) {
            btn.addEventListener("click", function () {
                document.querySelectorAll(".notes-tab-btn").forEach(function (b) { b.classList.remove("active"); });
                btn.classList.add("active");
                loadNotes(btn.dataset.type);
            });
        });

        async function loadNotes(noteType) {
            var chapterId = chapterFilter.value;
            var content = document.getElementById("notesContent");
            if (!chapterId) {
                content.innerHTML = '<p class="empty-state">पहले ऊपर से एक specific Chapter चुनें (सभी नहीं)।</p>';
                return;
            }
            content.innerHTML = '<p class="empty-state">⏳ AI Notes तैयार हो रहे हैं...</p>';

            var res = await fetch(SUPABASE_FN_BASE + "generate-notes", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + SUPABASE_ANON_KEY,
                    "apikey": SUPABASE_ANON_KEY
                },
                body: JSON.stringify({ chapter_id: chapterId, note_type: noteType })
            });
            var data = await res.json();
            if (data.error) {
                content.innerHTML = '<p class="empty-state">गड़बड़ हुई: ' + data.error + '</p>';
                return;
            }
            renderNotes(noteType, data);
        }

        function renderNotes(noteType, data) {
            window.lastNotesData = data;
            window.lastNotesType = noteType;
            var content = document.getElementById("notesContent");
            var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">' +
                '<h3 style="margin:0;">' + data.chapter_name + '</h3>' +
                '<button class="btn-primary" onclick="saveNotesToLibrary()" style="font-size:12px;padding:6px 12px;">💾 Save</button>' +
                '</div>';

            if (noteType === "short" || noteType === "detailed") {
                var text = data.content
                    .replace(/^## (.*)$/gm, '<h4 style="color:var(--primary-color);margin:16px 0 6px;">$1</h4>')
                    .replace(/^- (.*)$/gm, '<li>$1</li>')
                    .replace(/\n/g, '<br>');
                html += '<div style="line-height:1.8;">' + text + '</div>';
            } else if (noteType === "formulas") {
                html += '<ul style="list-style:none;">';
                (data.items || []).forEach(function (item) {
                    html += '<li style="padding:10px;background:var(--bg-light);border-radius:8px;margin-bottom:8px;"><strong>' + item.term + ':</strong> ' + item.value + '</li>';
                });
                html += '</ul>';
            } else if (noteType === "flashcards") {
                html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;">';
                (data.items || []).forEach(function (item, i) {
                    html += '<div class="flashcard" onclick="this.classList.toggle(\'flipped\')">' +
                        '<div class="flashcard-inner">' +
                        '<div class="flashcard-front">' + item.front + '</div>' +
                        '<div class="flashcard-back">' + item.back + '</div>' +
                        '</div></div>';
                });
                html += '</div><p style="font-size:12px;color:var(--text-light);margin-top:10px;">💡 Card पर click करके पलटें</p>';
            } else if (noteType === "important_questions") {
                html += '<h4 style="color:var(--primary-color);margin-bottom:8px;">MCQ</h4>';
                (data.mcq || []).forEach(function (q, i) {
                    html += '<p style="margin-bottom:6px;"><strong>' + (i + 1) + '.</strong> ' + q.question_text + ' <span style="color:var(--practice);font-weight:600;">(' + q.correct_answer + ')</span></p>';
                });
                html += '<h4 style="color:var(--primary-color);margin:16px 0 8px;">Short Answer</h4>';
                (data.short || []).forEach(function (q, i) {
                    html += '<p style="margin-bottom:6px;"><strong>' + (i + 1) + '.</strong> ' + q.question_text + '</p>';
                });
                html += '<h4 style="color:var(--primary-color);margin:16px 0 8px;">Long Answer</h4>';
                (data.long || []).forEach(function (q, i) {
                    html += '<p style="margin-bottom:6px;"><strong>' + (i + 1) + '.</strong> ' + q.question_text + '</p>';
                });
            }
            content.innerHTML = html;
        }

        subjectFilter.addEventListener("change", function () {
            document.getElementById("openNotesBtn").style.display = subjectFilter.value ? "inline-block" : "none";
            document.getElementById("notesPanel").style.display = "none";
        });
        
        document.addEventListener("DOMContentLoaded", async () => {
            if (window.authCheckReady) { await window.authCheckReady; }
            if (typeof hasAccess === "function" && !hasAccess('question_bank')) {
                showUpgradeAlert("Question Bank");
                window.location.href = "index.html";
            }
        });

    </script>
</body>
</html>
