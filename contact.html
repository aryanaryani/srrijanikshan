<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Srrijan Ikshan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth-check.js"></script>
    <style>
        :root {
            --primary-color: #2563EB;
            --text-dark: #0F172A;
            --text-light: #475569;
            --bg-light: #F8FAFC;
            --white: #FFFFFF;
            --border-color: #E2E8F0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Noto Sans Devanagari', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); line-height: 1.6; }
        a { text-decoration: none; }
        .container { max-width: 800px; margin: 0 auto; padding: 0 20px; }
        
        header { background: var(--white); box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05); position: sticky; top: 0; z-index: 1000; }
        .nav-container { display: flex; justify-content: space-between; align-items: center; height: 75px; }
        .logo { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
        .logo-text-dark { color: var(--text-dark); }
        .logo-text-blue { color: var(--primary-color); }
        .btn-primary { background: var(--primary-color); color: var(--white); padding: 8px 18px; border-radius: 8px; font-weight: 600; }

        .contact-card { background: var(--white); border-radius: 16px; padding: 40px; margin: 50px 0; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05); text-align: center; }
        .contact-card h1 { font-size: 30px; margin-bottom: 10px; }
        .contact-card p { color: var(--text-light); margin-bottom: 30px; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 15px; }
        
        .btn-submit { background: var(--primary-color); color: var(--white); padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; }

        footer { background: var(--text-dark); color: var(--white); padding: 30px 0; text-align: center; }
    </style>
    <link rel="icon" type="image/png" href="logo2.png">
</head>
<body>
    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <span class="logo-text-dark">Topper</span><span class="logo-text-blue">Way</span>
            </a>
            <a href="index.html" class="btn-primary">Home</a>
        </div>
    </header>

    <div class="container">
        <div class="contact-card">
            <h1>संपर्क करें (Contact Support)</h1>
            <p>किसी भी प्रश्न या सहायता के लिए नीचे दिया गया फॉर्म भरें।</p>

            <form id="contactForm">
                <div class="form-group">
                    <label>पूरा नाम</label>
                    <input type="text" id="contactName" required placeholder="अपना नाम लिखें">
                </div>
                <div class="form-group">
                    <label>ईमेल पता</label>
                    <input type="email" id="contactEmail" required placeholder="अपना ईमेल दर्ज करें">
                </div>
                <div class="form-group">
                    <label>संदेश</label>
                    <textarea rows="4" id="contactMessage" required placeholder="अपना प्रश्न या सहायता विवरण लिखें"></textarea>
                </div>
                <button type="submit" class="btn-submit" id="contactSubmitBtn">संदेश भेजें</button>
            </form>
            <p id="contactStatus" style="margin-top:14px;font-size:14px;"></p>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2026 Srrijan Ikshan. All rights reserved.</p>
        </div>
    </footer>

    <script>
        var supabase = window.supabase.createClient(
            "https://tphrdecdljxaqogocuxw.supabase.co",
            "sb_publishable_ot4NbsQjhhSPdj8VB76kRQ_TNQL3IUy"
        );

        document.getElementById("contactForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            var btn = document.getElementById("contactSubmitBtn");
            var status = document.getElementById("contactStatus");
            btn.disabled = true;
            btn.textContent = "भेजा जा रहा है...";

            var { error } = await supabase.from("contact_messages").insert({
                full_name: document.getElementById("contactName").value,
                email: document.getElementById("contactEmail").value,
                message: document.getElementById("contactMessage").value
            });

            if (error) {
                status.style.color = "red";
                status.textContent = "कुछ गड़बड़ हुई, दोबारा कोशिश करें।";
            } else {
                status.style.color = "green";
                status.textContent = "✅ आपका संदेश प्राप्त हो गया है। हम जल्द ही आपसे संपर्क करेंगे!";
                document.getElementById("contactForm").reset();
            }
            btn.disabled = false;
            btn.textContent = "संदेश भेजें";
        });
    </script>
</body>
</html>
